<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hospital Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark">+</span>
            <span class="brand-name">CarePoint</span>
        </div>
        <nav class="nav">
            <a href="#/dashboard" data-view="dashboard">Dashboard</a>
            <a href="#/patients" data-view="patients">Patients</a>
            <a href="#/doctors" data-view="doctors">Doctors</a>
            <a href="#/departments" data-view="departments">Departments</a>
            <a href="#/appointments" data-view="appointments">Appointments</a>
        </nav>
    </aside>

    <main class="main">
        <header class="page-header">
            <div>
                <h1 id="page-title">Dashboard</h1>
                <p id="page-subtitle" class="muted"></p>
            </div>
            <div id="page-actions" class="page-actions"></div>
        </header>
        <section id="view" class="view"></section>
    </main>
</div>

<!-- shared modal used for forms, details and confirmations -->
<dialog id="modal" class="modal">
    <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
